<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <title>Car Parts List</title>
</head>
<body>
    <H1 class="montserrat-title">Car Parts</H1>
    <div>
        <form>
            <label for="itemNameInput">Part Name: </label>
            <input id="itemNameInput" type="text">

            <label for="itemPriceInput">Price: </label>
            <input id="itemPriceInput" type="number">

            <button id="addItem" type="button">Add Item</button>
        </form>
        <table>
            <thead>
                <tr>
                    <th>Part:</th>
                    <th>Price:</th>
                    <th>Bought:</th>
                </tr>
            </thead>
            <tbody id="tableItems">
            
            </tbody>
        </table>

        <table>
            <thead>
                <tr>
                    <th>Need to Buy:</th>
                    <th id="needToBuy"></th>
                </tr>
                <tr>
                    <th>Total:</th>
                    <th id="total"></th>
                </tr>
            </thead>
        </table>
    </div>


    <script src="index.js" defer></script>
</body>
</html>
